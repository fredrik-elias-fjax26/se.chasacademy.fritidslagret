plugins {
    id("java")
    id("application")
}

group = "se.chasacademy"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
    testImplementation(libs.mockito)
    mockitoAgent(libs.mockito) { transitive = false }

    testRuntimeOnly(libs.junit.platform.launcher)
}

application {
    mainClass = "se.chasacademy.fritidslagret.Main"
}

tasks.test {
    useJUnitPlatform()
    jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")

    filter {
        // Kör inte UI-testerna här
        excludeTestsMatching "*UI*"
    }

    outputs.upToDateWhen { false }

}

tasks.register("ui-test", Test) {
    description = "UI tests need separated runtime"
    group = "verification"

    testClassesDirs = tasks.test.testClassesDirs
    classpath = tasks.test.classpath

    useJUnitPlatform()
    jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")

    filter {
        includeTestsMatching "*UI*"
    }

    outputs.upToDateWhen { false }

}

tasks.named("jar") {
    dependsOn "test"
    dependsOn "ui-test"
    manifest {
        attributes "Main-Class": "se.chasacademy.fritidslagret.Main"
    }
    doFirst { println("Tester Godkända, Bygger jar")}
}

tasks.named("run") {
    dependsOn("test")
    dependsOn "ui-test"
    standardInput = System.in
    doFirst {println("\nTester Godkända, Startar Main\n")}
}